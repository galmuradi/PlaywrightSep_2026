trigger:
  branches:
    include:
      - main
  batch: true

pool:
  vmImage: ubuntu-latest

steps:

  # Install Node.js
  - task: UseNode@1
    inputs:
      version: "20.x"
    displayName: "Install Node.js 20"

  # Verify Node.js version
  - script: |
      node --version
      npm --version
    displayName: "Verify Node.js version"

  # Install project dependencies
  - script: |
      npm ci
    displayName: "Install project dependencies"

  # Install Playwright browsers
  - script: |
      npx playwright install --with-deps
    displayName: "Install Playwright browsers"

  # Run Playwright tests
  - script: |
      npx playwright test
    displayName: "Run Playwright tests"
    env:
      CI: "true"

  # Diagnostic: check where Playwright created the reports
  - script: |
      echo "===== Current directory ====="
      pwd

      echo "===== Repository contents ====="
      ls -la

      echo "===== Playwright report ====="
      ls -la playwright-report || true

      echo "===== Allure results ====="
      ls -la allure-results || true
    displayName: "Check generated reports"
    condition: always()

  # Install Allure CLI and generate report
  - script: |
      npm install -g allure-commandline --force
      allure generate allure-results --clean -o allure-report
    displayName: "Generate Allure Report"
    condition: always()

  # Publish Allure report
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: allure-report
      artifact: allure-report
      publishLocation: "pipeline"
    displayName: "Publish Allure Report"
    condition: always()

  # Publish Playwright HTML report
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: playwright-report
      artifact: playwright-report
      publishLocation: "pipeline"
    displayName: "Publish Playwright HTML Report"
    condition: always()


